dependencies = [
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "astral>=3.2",
    "httpx2>=2.16.0",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
]
