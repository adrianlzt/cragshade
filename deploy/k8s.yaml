# Despliegue en el k3s de Oracle (oracle-frankfurt-nixos-*).
#   KUBE_ADMIN=1 kubectl --context oracle-frankfurt-nixos-ts apply -f deploy/k8s.yaml
# Nueva versión: KUBE_ADMIN=1 kubectl ... -n cragshade rollout restart deploy/cragshade
#
# Fotos en Cloudflare R2 y copia continua de SQLite con Litestream al mismo bucket. Credenciales en el
# Secret cragshade-s3 (no está en el repo; ver README): AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# CRAGSHADE_S3_ENDPOINT, CRAGSHADE_S3_BUCKET, CRAGSHADE_MEDIA_URL.
apiVersion: v1
kind: Namespace
metadata:
  name: cragshade
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cragshade-data
  namespace: cragshade
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litestream
  namespace: cragshade
data:
  litestream.yml: |
    dbs:
      - path: /data/cragshade.db
        replica:
          type: s3
          bucket: ${CRAGSHADE_S3_BUCKET}
          path: litestream/cragshade.db
          endpoint: ${CRAGSHADE_S3_ENDPOINT}
          region: auto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cragshade
  namespace: cragshade
spec:
  replicas: 1
  # SQLite + volumen RWO: nunca dos pods a la vez.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cragshade
  template:
    metadata:
      labels:
        app: cragshade
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Si el volumen está vacío (nodo nuevo), recupera la base de datos del bucket.
        - name: restore
          image: litestream/litestream:0.5.18
          args: [restore, -if-db-not-exists, -if-replica-exists, /data/cragshade.db]
          envFrom:
            - secretRef:
                name: cragshade-s3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
      containers:
        - name: litestream
          image: litestream/litestream:0.5.18
          args: [replicate]
          envFrom:
            - secretRef:
                name: cragshade-s3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: app
          image: ghcr.io/adrianlzt/cragshade:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: CRAGSHADE_DATA
              value: /data
          envFrom:
            - secretRef:
                name: cragshade-s3
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              # Pillow descomprime panorámicas grandes en memoria (OOMKilled con 768Mi el 7/11/2026).
              memory: 1536Mi
      volumes:
        - name: litestream
          configMap:
            name: litestream
        - name: data
          persistentVolumeClaim:
            claimName: cragshade-data
---
apiVersion: v1
kind: Service
metadata:
  name: cragshade
  namespace: cragshade
spec:
  selector:
    app: cragshade
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cragshade
  namespace: cragshade
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: cragshade.k8s.adrianlzt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cragshade
                port:
                  number: 80
  tls:
    - hosts: [cragshade.k8s.adrianlzt.com]
